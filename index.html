<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NovaCalc is a beginner-friendly web calculator built with HTML, CSS, and JavaScript."
    />
    <title>NovaCalc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <section class="calculator" aria-label="NovaCalc calculator">
        <header class="calculator__header">
          <p class="eyebrow">Beginner-friendly</p>
          <h1 id="app-title">NovaCalc</h1>
        </header>

        <output
          class="calculator__display"
          id="display"
          aria-live="polite"
          aria-label="Calculator display"
        >0</output>

        <div class="calculator__keys" aria-label="Calculator controls">
          <button class="key key--danger" type="button" data-action="clear">AC</button>
          <button class="key" type="button" data-action="delete">DEL</button>
          <button class="key key--operator" type="button" data-value="%">%</button>
          <button class="key key--operator" type="button" data-value="÷">÷</button>

          <button class="key" type="button" data-value="7">7</button>
          <button class="key" type="button" data-value="8">8</button>
          <button class="key" type="button" data-value="9">9</button>
          <button class="key key--operator" type="button" data-value="×">×</button>

          <button class="key" type="button" data-value="4">4</button>
          <button class="key" type="button" data-value="5">5</button>
          <button class="key" type="button" data-value="6">6</button>
          <button class="key key--operator" type="button" data-value="-">-</button>

          <button class="key" type="button" data-value="1">1</button>
          <button class="key" type="button" data-value="2">2</button>
          <button class="key" type="button" data-value="3">3</button>
          <button class="key key--operator" type="button" data-value="+">+</button>

          <button class="key" type="button" data-action="toggle-sign">+/-</button>
          <button class="key" type="button" data-value="0">0</button>
          <button class="key" type="button" data-value=".">.</button>
          <button class="key key--equal" type="button" data-action="calculate">=</button>
        </div>
      </section>
    </main>

    <footer class="footer">Built by Arpit using HTML, CSS &amp; JavaScript</footer>

    <script src="script.js"></script>
  </body>
</html>
